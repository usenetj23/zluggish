services:
  zluggish:
    image: ghcr.io/zluggish/zluggish:latest
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ../storage/:/usr/src/app/zluggish/storage
      # Java tools for the Companion app, downloaded only on request. Keeps them across updates.
      - ../tools/:/usr/src/app/zluggish/tools
    ports:
      - 80:80
      - 443:443
      - 8080:8080
      - 3024:3024/udp
      - 3025:3025
    restart: unless-stopped
