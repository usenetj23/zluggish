<!DOCTYPE html>
<!-- Modified for Zluggish: the inline module script moved to src/boot-chat-settings.mjs because the server's Content-Security-Policy forbids inline scripts. Upstream: SauceLLC/sauce4zwift 6de4254a454d376e8bfce02c3a098274a7723711 (GPL-3.0). -->
<html class="settings-page" tabindex="0" data-settings-key="chat-settings-v2">
    <head>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
        <meta name="apple-mobile-web-app-capable" content="yes"/>
        <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';"/>

        <title>Chat - Settings - Zluggish Overlay</title>

        <script src="./src/preloads.js"></script>

        <link id="favicon" rel="shortcut icon" href="images/favicon.png"/>
        <link rel="stylesheet" href="css/common.css"/>

        <script type="module" src="./src/boot-chat-settings.mjs"></script>
    </head>
    <body>
        <div id="titlebar">
            <header>
                <div class="logo"><img src="images/icon128.png"/></div>
                <div class="title">Chat - Settings</div>
                <div class="filler"></div>
                <div class="buttons">
                    <div title="Close this window" class="button close electron-only"><ms>close</ms></div>
                </div>
            </header>
        </div>
        <div id="settings">
            <form>
                <label title="Remove old messages after this many seconds. Set to zero to never remove them.">
                    <key>Message cleanup:</key>
                    <input type="number" min="0" step="1" name="cleanup"/> <small>(seconds)</small>
                </label>
                <label title="Put most recent messages on top">
                    <key>Reverse order:</key>
                    <input type="checkbox" name="reverseOrder"/>
                </label>
                <label>
                    <key>Right align:</key>
                    <input type="checkbox" name="rightAlign"/>
                </label>
                <label>
                    <key>Theme override:</key>
                    <select is="sauce-theme" override></select>
                </label>
                <label>
                    <key>Transparency:</key>
                    <input type="range" name="messageTransparency" min="0" max="100" value="30" step="1"/>
                    <input type="number" name="messageTransparency" value="30" style="--size: 5"/>%
                </label>
                <label title="Mostly useful for streamers using OBS window and browser sources">
                    <key>Solid background:</key>
                    <input type="checkbox" name="solidBackground"/>
                </label>
                <label>
                    <key>Background color:</key>
                    <input type="color" title="Pick the colour" name="backgroundColor" data-depends-on="solidBackground"/>
                    <input type="text" title="The same colour as text: #rrggbb, rgb(...) or a name such as black" name="backgroundColor" data-depends-on="solidBackground" size="7"/>
                    <input type="number" title="Opacity of this colour, 0 (invisible) to 100 (solid)" name="backgroundAlpha" data-depends-on="solidBackground"
                           style="--size: 7" min="0" max="100" step="1" value="100"/> <small>% opaque</small>
                </label>
            </form>
        </div>
    </body>
</html>
